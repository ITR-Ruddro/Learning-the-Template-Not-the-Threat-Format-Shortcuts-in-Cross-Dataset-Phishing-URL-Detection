[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "urlformat-audit"
version = "0.1.0"
description = "Detect class-conditional URL formatting (shortcut risk) in labelled phishing/malicious URL datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Author names (to be added)" }]
keywords = ["phishing", "url", "dataset audit", "shortcut learning", "machine learning", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
urlformat-audit = "urlformat_audit.cli:main"

[project.urls]
Homepage = "https://github.com/[user]/urlformat-audit"
Issues = "https://github.com/[user]/urlformat-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urlformat_audit"]
